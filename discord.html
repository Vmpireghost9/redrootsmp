<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedRoot SMP — Discord</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sand: #f5e6c8;
  --sand2: #eddcb4;
  --peach: #f2a96e;
  --orange: #e8622a;
  --orange2: #c44a1a;
  --sky: #7ec8e3;
  --teal: #2a9d8f;
  --ocean: #1a6b7a;
  --foam: #eaf7fb;
  --text: #1e2d2f;
  --muted: #6b7f82;
  --display: 'Playfair Display', serif;
  --body-font: 'Plus Jakarta Sans', sans-serif;
  --title: 'Plus Jakarta Sans', sans-serif;
}

html { scroll-behavior: smooth; }
body {
  background: var(--sand);
  color: var(--text);
  font-family: var(--body-font);
  font-size: 17px;
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
a { text-decoration: none; color: inherit; }

/* NAV */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.1rem 3rem;
  background: rgba(245,230,200,0.82);
  backdrop-filter: blur(16px);
  border-bottom: 1.5px solid rgba(232,98,42,0.15);
}
.nav-left { display: flex; align-items: center; gap: 0.9rem; }
.nav-brand { font-family: var(--display); font-size: 1rem; color: var(--orange); }
.nav-btn {
  font-family: var(--title);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--orange);
  color: #fff;
  padding: 0.6rem 1.4rem;
  border-radius: 100px;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
}
.nav-btn:hover { background: var(--orange2); }

/* BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg,
    #87ceeb 0%,
    #b8e4f7 28%,
    #f9d29d 58%,
    #f5c07a 74%,
    #f5e6c8 100%
  );
  z-index: 0;
}

/* CLOUDS */
.cloud { position: absolute; background: rgba(255,255,255,0.72); border-radius: 100px; z-index: 1; filter: blur(2px); }
.cloud::before, .cloud::after { content: ''; position: absolute; background: rgba(255,255,255,0.72); border-radius: 50%; }
.c1 { width:130px; height:38px; top:17%; left:8%;  animation: drift 18s ease-in-out infinite alternate; }
.c1::before { width:64px; height:54px; top:-30px; left:14px; }
.c1::after  { width:48px; height:40px; top:-22px; left:60px; }
.c2 { width:95px;  height:30px; top:22%; right:12%; animation: drift 26s ease-in-out infinite alternate-reverse; }
.c2::before { width:48px; height:40px; top:-22px; left:10px; }
.c2::after  { width:36px; height:30px; top:-16px; left:46px; }
.c3 { width:72px;  height:22px; top:9%;  right:26%; animation: drift 22s ease-in-out infinite alternate; }
.c3::before { width:36px; height:32px; top:-18px; left:8px; }
@keyframes drift { from { transform: translateX(-20px); } to { transform: translateX(20px); } }

/* OCEAN */
.ocean-wrap {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 38%;
  z-index: 2;
  overflow: hidden;
}
.ocean-layer { position: absolute; bottom: 0; left: -10%; right: -10%; border-radius: 55% 55% 0 0 / 20% 20% 0 0; }
.ocean-back  { height: 90%; background: #4baec9; opacity: 0.5; animation: wave 6s ease-in-out infinite; }
.ocean-mid   { height: 78%; background: #2a9d8f; opacity: 0.72; animation: wave 4.5s ease-in-out infinite reverse; }
.ocean-front { height: 62%; background: linear-gradient(180deg,#1a8c8c 0%,#1a6b7a 100%); animation: wave 3.5s ease-in-out infinite; }
.foam-layer  { position: absolute; bottom: 61%; left: -10%; right: -10%; height: 30px; background: rgba(255,255,255,0.42); border-radius: 50%; filter: blur(7px); animation: foam 3.5s ease-in-out infinite; }
@keyframes wave { 0%,100%{transform:translateY(0) scaleX(1)} 50%{transform:translateY(-14px) scaleX(1.04)} }
@keyframes foam { 0%,100%{transform:translateY(0);opacity:.42} 50%{transform:translateY(-12px);opacity:.68} }

/* MAIN CARD */
.card-wrap {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 8rem 2rem 4rem;
  animation: fadeUp 0.8s 0.1s ease both;
}

.hero-tag {
  font-family: var(--title);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ocean);
  background: rgba(255,255,255,0.65);
  border: 1.5px solid rgba(42,157,143,0.25);
  padding: 0.35rem 1.1rem;
  border-radius: 100px;
  margin-bottom: 1.2rem;
}

.discord-icon {
  width: 90px;
  height: 90px;
  background: #5865F2;
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.6rem;
  box-shadow: 0 12px 40px rgba(88,101,242,0.35);
  animation: logoBob 3.5s ease-in-out infinite;
}
.discord-icon svg { width: 52px; height: 52px; fill: #fff; }

@keyframes logoBob {
  0%,100% { transform: translateY(0) rotate(-1deg); }
  50%      { transform: translateY(-10px) rotate(1deg); }
}

h1 {
  font-family: var(--display);
  font-size: clamp(2.4rem, 7vw, 5rem);
  line-height: 1;
  color: var(--text);
  text-shadow: 0 4px 0 rgba(0,0,0,0.07);
  margin-bottom: 0.25em;
}
h1 span { color: var(--orange); }

.sub {
  font-size: 1.05rem;
  color: var(--text);
  max-width: 420px;
  margin: 0.8rem auto 2rem;
  font-weight: 500;
  text-shadow: 0 1px 8px rgba(255,255,255,0.6);
}

.btn-discord {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--title);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  background: #5865F2;
  color: #fff;
  padding: 1rem 2.4rem;
  border-radius: 100px;
  box-shadow: 0 8px 28px rgba(88,101,242,0.35);
  transition: background 0.2s, transform 0.15s;
  margin-bottom: 1rem;
}
.btn-discord:hover { background: #4752c4; transform: translateY(-2px); }
.btn-discord svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }

.btn-back {
  font-family: var(--title);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border: 2px solid rgba(42,157,143,0.4);
  color: var(--ocean);
  padding: 1rem 2.4rem;
  border-radius: 100px;
  transition: border-color 0.2s, color 0.2s, transform 0.15s;
  background: rgba(255,255,255,0.4);
  display: inline-block;
}
.btn-back:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-2px); }

.ctas { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

/* COUNTDOWN */
.redirect-notice {
  margin-top: 2rem;
  font-family: var(--title);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
#countdown { color: var(--orange); font-weight: 700; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* FOOTER */
footer {
  position: relative;
  z-index: 10;
  background: var(--text);
  color: rgba(255,255,255,0.45);
  padding: 1.6rem 3rem;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
}
.footer-brand { font-family: var(--display); font-size: 0.85rem; color: rgba(255,255,255,0.85); }
.footer-copy { font-family: var(--title); font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase; }

@media (max-width: 768px) {
  nav { padding: 1rem 1.5rem; }
  .card-wrap { padding: 7rem 1.5rem 3rem; }
  footer { flex-direction: column; gap: 1rem; text-align: center; }
}
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="ocean-wrap">
  <div class="ocean-layer ocean-back"></div>
  <div class="ocean-layer ocean-mid"></div>
  <div class="ocean-layer ocean-front"></div>
  <div class="foam-layer"></div>
</div>

<!-- Nav -->
<nav>
  <div class="nav-left">
    <span class="nav-brand">RedRoot SMP</span>
  </div>
  <a href="/" class="nav-btn">Home</a>
</nav>

<!-- Main content -->
<div class="card-wrap">
  <span class="hero-tag">Community</span>

  <!-- Discord logo -->
  <div class="discord-icon">
    <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
      <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
    </svg>
  </div>

  <h1>Join Our <span>Discord</span></h1>
  <p class="sub">Chat with the community, get updates, and stay connected with fellow RedRoot players.</p>

  <div class="ctas">
    <a href="https://discord.gg/YOUR_INVITE_CODE" class="btn-discord" id="discord-link" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Join Discord
    </a>
    <a href="/" class="btn-back">← Back to Site</a>
  </div>

  <p class="redirect-notice">Auto-redirecting in <span id="countdown">5</span>s…</p>
</div>

<!-- Footer -->
<footer>
  <div style="display:flex;align-items:center;gap:0.8rem;">
    <span class="footer-brand">RedRoot Studios</span>
  </div>
  <div class="footer-copy">© 2026 RedRoot Studios — All rights reserved</div>
</footer>

<script>
  // ——— UPDATE THIS WITH YOUR REAL DISCORD INVITE LINK ———
  const DISCORD_URL = 'https://discord.gg/RuVq5N2wT7';
  // ———————————————————————————————————————————————————————

  document.getElementById('discord-link').href = DISCORD_URL;

  let secs = 5;
  const el = document.getElementById('countdown');
  const timer = setInterval(() => {
    secs--;
    el.textContent = secs;
    if (secs <= 0) {
      clearInterval(timer);
      window.location.href = DISCORD_URL;
    }
  }, 1000);
</script>
</body>
</html>
